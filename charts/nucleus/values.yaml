# =============================================================================
# nucleus — default values
# Every field here can be overridden in apps/<name>/values.yaml
# =============================================================================

# -- Image
image:
  # Full ECR repository path. Required — no default.
  # e.g. 445746982355.dkr.ecr.us-east-1.amazonaws.com/theo-orchestrator
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

# -- Replica count (ignored when keda.enabled or hpa.enabled is true)
replicaCount: 1

# -- Service
service:
  port: 8000
  targetPort: 8000

# -- Resources
# CPU limit intentionally omitted by default — CPU throttling causes latency
# spikes in Python services. Set explicitly if needed.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# -- Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # readOnlyRootFilesystem disabled by default — Python/FastAPI write to tmp.
  # Enable per-app once you've confirmed no filesystem writes at runtime.
  readOnlyRootFilesystem: false

# -- Liveness probe
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 30
  failureThreshold: 3

# -- Readiness probe
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# -- Service account
serviceAccount:
  create: true
  # Annotations — add IRSA role ARN here when the IRSA module is ready:
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/theo-orchestrator
  annotations: {}

# -- Plain (non-secret) environment variables
# env:
#   ENV: production
#   AWS_REGION: us-east-1
env: {}

# -- Node placement
nodeSelector: {}
tolerations: []
affinity: {}

externalSecret:
  enabled: false
  refreshInterval: 1h

  stores: {}
  # Example shape:
  # stores:
  #   secrets:
  #     enabled: true
  #     type: SecretsManager        # or ParameterStore — maps to spec.provider.aws.service
  #     region: us-east-1
  #     path: theo/orchestrator     # base path in the backend
  #     keys:
  #       - secretKey: NUTRITIONIX_API_KEY
  #         property: NUTRITIONIX_API_KEY

# -- KEDA ScaledObject
# Mutually exclusive with hpa.enabled — the chart will fail if both are true.
keda:
  enabled: false
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  cpuThreshold: 70
  memoryThreshold: 80
  triggers: []

# -- HPA (Horizontal Pod Autoscaler)
# Mutually exclusive with keda.enabled — the chart will fail if both are true.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# -- ConfigMap
# Optional config files mounted into the container (e.g. routes.yaml).
configMap:
  enabled: false
  # Key → file content
  data: {}
  # Where to mount it in the container
  mountPath: /app/config

# -- HTTPRoute (Gateway API)
httpRoute:
  enabled: false
  hostname: ""
  gateway:
    name: humboldt-internal
    namespace: envoy-gateway-system
